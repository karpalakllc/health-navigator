name: CI

on:
  push:
    branches: [main]
  # Every pull request, not just those targeting main. Restricting by base branch
  # silently skips CI on stacked PRs — a dependency-upgrade PR carrying three
  # major versions sat with no checks at all because its base was a feature branch.
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its in-flight run. Pushes to main
# are never cancelled: the path filter diffs each push against the one before,
# so a cancelled API push followed by a docs-only push would leave the API
# change untested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Path filter: which parts of the monorepo this push or PR touched, so a
    # docs-only change does not spend ten minutes on PHP, Node and a browser.
    # Plain git rather than a third-party action. Anything it cannot decide
    # (first push of a branch, a force-push whose old head is gone) runs
    # everything. A change to this workflow runs everything too.
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi

          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base ($base); running every job."
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)"
          printf '%s\n' "$changed"

          matches() { printf '%s\n' "$changed" | grep -Eq "$1" && echo true || echo false; }
          echo "api=$(matches '^(apps/api/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "web=$(matches '^(apps/web/|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"

  secrets:
    # Scans the commits of this push or PR (the whole history on a manual run)
    # with gitleaks' default rules; .gitleaks.toml allowlists the deliberately
    # public test fixtures. Pinned by commit SHA: a secret scanner sees every
    # commit, so it must not change under us through a moved tag.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report through the job log only; commenting needs a write token.
          GITLEAKS_ENABLE_COMMENTS: false

  larastan:
    # Larastan (PHPStan) level 5 against apps/api/phpstan-baseline.neon, which
    # holds the errors that predate the analyser. New and changed code must pass
    # outright; see docs/pr-verification.md "Static analysis".
    name: Larastan (level 5)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous commit / PR base, to compare baseline sizes.
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-
      - run: composer install --no-interaction --prefer-dist
      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github
      - name: Baseline must not grow
        # Regenerating the baseline would let a new error in silently. Fixing
        # one shrinks it; nothing may add to it. Compared entry by entry
        # (path + identifier + message), so fixing one error and baselining a
        # different one does not pass on equal totals.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; fi

          if [ -z "$base" ] || ! git cat-file -e "$base:apps/api/phpstan-baseline.neon" 2>/dev/null; then
            echo "No baseline at the base commit; nothing to compare."
            exit 0
          fi

          # One "count<TAB>path<TAB>identifier<TAB>message" line per entry.
          entries() {
            awk '
              /^\t\t-$/ { if (m != "") print c "\t" p "\t" i "\t" m; m = ""; i = ""; c = 0; p = "" }
              /^\t\t\tmessage: / { sub(/^\t\t\tmessage: /, ""); m = $0 }
              /^\t\t\tidentifier: / { sub(/^\t\t\tidentifier: /, ""); i = $0 }
              /^\t\t\tcount: / { sub(/^\t\t\tcount: /, ""); c = $0 + 0 }
              /^\t\t\tpath: / { sub(/^\t\t\tpath: /, ""); p = $0 }
              END { if (m != "") print c "\t" p "\t" i "\t" m }
            '
          }

          git show "$base:apps/api/phpstan-baseline.neon" | entries > /tmp/baseline-before.tsv
          entries < phpstan-baseline.neon > /tmp/baseline-after.tsv
          echo "Baselined entries: $(wc -l < /tmp/baseline-before.tsv) -> $(wc -l < /tmp/baseline-after.tsv)"

          grown="$(awk -F '\t' '
            NR == FNR { before[$2 FS $3 FS $4] += $1; next }
            { after[$2 FS $3 FS $4] += $1 }
            END { for (k in after) if (after[k] > before[k] + 0) print after[k] - before[k] "x " k }
          ' /tmp/baseline-before.tsv /tmp/baseline-after.tsv)"

          if [ -n "$grown" ]; then
            echo "$grown"
            echo "::error file=apps/api/phpstan-baseline.neon::The Larastan baseline gained entries (listed above). Fix the new errors instead of baselining them."
            exit 1
          fi

  api:
    # Both ends of the supported range. composer.json declares ^8.4, so 8.4 has
    # to be tested -- declaring a floor nothing runs is how a "supported" version
    # turns out to be broken on someone else's host. 8.5 is what we deploy on.
    name: Laravel API (SQLite, PHP ${{ matrix.php }})
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - run: composer install --no-interaction --prefer-dist
      - name: Dependency audit
        # Fails on any known advisory in the locked dependency set. One matrix
        # leg is enough — the lock file is the same for both.
        if: matrix.php == '8.5'
        run: composer audit --locked
      - name: Prepare environment
        # The suite boots the full framework, so it needs an APP_KEY and a .env.
        # Without them every framework-dependent test fails on
        # MissingAppKeyException (and password reset on a null hash key).
        # phpunit.xml's <env> block still wins over these values — Laravel loads
        # .env immutably, so APP_ENV stays "testing" and the DB stays SQLite.
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Code style
        run: ./vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  api-postgres:
    # The suite runs on SQLite for speed, but production is PostgreSQL and the
    # code branches on the driver: ILIKE vs LIKE in ScriptInsensitiveSearch,
    # raw date() in AnalyticsService, json_extract vs ->> in the search
    # aggregation, and NULL ordering — which is exactly inverted between the two
    # engines (SQLite sorts NULLs last under DESC, PostgreSQL sorts them first).
    # Without this job those paths are never executed before deploy.
    name: Laravel API (PostgreSQL)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zdravje_test
          POSTGRES_USER: zdravje
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          # Not in the default extension set — the job fails confusingly without it.
          extensions: pdo_pgsql, pgsql
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        # The suite boots the full framework, so it needs an APP_KEY and a .env.
        # Without them every framework-dependent test fails on
        # MissingAppKeyException (and password reset on a null hash key).
        # APP_ENV still comes from phpunit.xml ("testing"), but the DB_* values
        # on the Tests step are exported in the shell, which outranks both .env
        # and phpunit.xml's non-forced <env> entries — so this job runs on
        # PostgreSQL, not SQLite.
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Tests
        # Shell environment wins over phpunit.xml's <env> entries (they are not
        # forced), so no separate phpunit config is needed.
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: zdravje_test
          DB_USERNAME: zdravje
          DB_PASSWORD: secret

  web:
    name: Next.js Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Dependency audit
        # Runtime dependencies only; dev tooling never ships to users.
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          # Required at build time — it is inlined into the bundle, and the build
          # now refuses to proceed without it rather than baking localhost into
          # robots.txt and every canonical URL. Any value works here; only the
          # deployed build needs the real origin.
          NEXT_PUBLIC_SITE_URL: https://ci.invalid

  e2e:
    # Browser suite (apps/web/e2e) against the real stack: the Laravel API on
    # PostgreSQL and a production build of the web app, both started by
    # Playwright's webServer config. The suite resets and seeds its own database
    # (E2ESeeder), and every API and web setting comes from
    # apps/web/e2e/support/env.ts, so no .env or data step is needed here.
    name: E2E (Playwright, Chromium)
    # The browser suite exercises both apps, so a change to either runs it.
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zdravje_e2e
          POSTGRES_USER: zdravje
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql
          coverage: none
      - name: Composer cache directory
        id: composer-cache
        working-directory: apps/api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.5-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.5-
      - name: Install API dependencies
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: E2E suite
        # CI=true (set by Actions): one retry, recorded with a trace.
        working-directory: apps/web
        run: npm run e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # <repo>/.e2e-output: report/ (HTML) and results/ (traces, screenshots).
          path: .e2e-output/
          include-hidden-files: true
          retention-days: 14
